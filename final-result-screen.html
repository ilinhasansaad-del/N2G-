<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="m.style.css">
</head>
<body>
     <!-- ==================== FINAL RESULT SCREEN ==================== -->
        <section id="final-result-screen" class="screen">

            <div id="final-result-content">

                <h2 id="game-complete-title">
                    Game Completed!
                </h2>

                <p id="final-message">
                    You completed the game!
                </p>


                <!-- SCORE SUMMARY -->
                <div id="score-summary">

                    <div class="summary-item">
                        <span>Total Score</span>
                        <strong id="final-score">0</strong>
                    </div>

                    <div class="summary-item">
                        <span>Total Attempts</span>
                        <strong id="total-attempts">0</strong>
                    </div>

                    <div class="summary-item">
                        <span>Accuracy</span>
                        <strong id="accuracy">0%</strong>
                    </div>

                    <div class="summary-item">
                        <span>Levels Completed</span>
                        <strong id="levels-completed">0/3</strong>
                    </div>

                </div>


                <!-- PERFORMANCE -->
                <div id="final-performance">

                    <h3 id="performance-rating">
                        Performance
                    </h3>

                    <p id="performance-message">
                        Keep practicing!
                    </p>

                </div>


                <!-- FINAL ACTIONS -->
                <div id="final-actions">

                    <button type="button" id="play-again-btn">
                        <a href="game-screen.html">Play again</a>
                    </button>

                    <button type="button" id="back-to-home-btn">
                        <a href="index.html" id="back-to-home">Back to Home</a>
                    </button>

                </div>

            </div>

        </section>

</body>
</html>

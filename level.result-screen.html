<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="m.style.css">
</head>
<body>
    <!-- ==================== LEVEL RESULT SCREEN ==================== -->
        <section id="level-result-screen" class="screen">

            <div id="level-result-content">

                <!-- WIN / LOSS STATUS -->
                <div id="result-status">

                    <h2 id="result-status-title">
                        <span id = "result-status-title-span">Level</span> Complete!
                    </h2>

                    <p id="result-status-message">
                        Great job!
                    </p>

                </div>


                <!-- RESULT DETAILS -->
                <div id="result-details">

                    <div class="result-item">
                        <span>Secret Number</span>
                        <strong id="result-secret-number">0</strong>
                    </div>

                    <div class="result-item">
                        <span>Points Earned</span>
                        <strong id="result-points-earned">0</strong>
                    </div>

                    <div class="result-item">
                        <span>Attempts Used</span>
                        <strong id="result-attempts-used">0</strong>
                    </div>

                    <div class="result-item">
                        <span>Performance</span>
                        <strong id="result-performance">Good</strong>
                    </div>

                </div>


                <!-- RESULT ACTIONS -->
                <div id="level-result-actions">

                    <button type="button" id="next-level-btn">
                        Next Level
                    </button>

                    <button type="button" id="finish-game-btn">
                        <a href="final-result-screen.html">Finish Game</a>
                    </button>

                </div>

            </div>

        </section>
<script src="script.js"></script>
</body>
</html>
